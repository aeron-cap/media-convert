services:
  media-convert:
    build: .
    image: media-convert:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      MAX_DURATION_MINUTES: ${MAX_DURATION_MINUTES:-180}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-50}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-100}
      YT_MIN_INTERVAL_SECONDS: ${YT_MIN_INTERVAL_SECONDS:-2}
      YT_REQUEST_SLEEP_SECONDS: ${YT_REQUEST_SLEEP_SECONDS:-0.5}
      YT_RETRIES: ${YT_RETRIES:-2}
      YT_PROXY: ${YT_PROXY:-}
      YT_POT_PROVIDER_URL: ${YT_POT_PROVIDER_URL:-}
      # Read only when ./cookies.txt is mounted below.
      YT_COOKIES_FILE: /config/cookies.txt
    volumes:
      - media-convert-data:/data
      # Optional: cookies of a throwaway YouTube account (see the README).
      # - ./cookies.txt:/config/cookies.txt:ro

  # Optional PO token provider. Start it with:
  #   docker compose --profile pot up -d
  # and set YT_POT_PROVIDER_URL=http://pot-provider:4416 in .env.
  # It is reachable only by the app, not from the host or the network.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    profiles: ["pot"]
    restart: unless-stopped
    init: true

volumes:
  media-convert-data:
