<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A play triangle with a download arrow cut out of it. The arrow is a real
       hole (a mask), so the mark sits on any tab colour. -->
  <mask id="arrow">
    <rect width="64" height="64" fill="#fff"/>
    <path d="M29 20v17M22.5 31l6.5 6.5 6.5-6.5M23 44h12" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <path d="M17 11l37 21-37 21z" fill="#7c9cff" stroke="#7c9cff" stroke-width="7" stroke-linejoin="round" mask="url(#arrow)"/>
</svg>
